# Runs the gate on every PR and on pushes to main / release branches.
# Merging never ships anything; releases are tags (docs/RELEASING.md §3).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, ready_for_review]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: commit-messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The PR title becomes the squash commit on main (docs/WORKFLOW.md §6).
      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bash tool/check_commit_msg.sh -

      - name: Every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" | bash tool/check_commit_msg.sh - || { echo "  commit: $sha"; status=1; }
          done
          exit $status

  check:
    name: check
    # Title edits re-run only commit-messages. `labeled` is included so adding the
    # `ios` label starts the iOS build, which needs this job.
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Gate
        env:
          CI: "true"
        run: bash tool/check.sh

  android-apk:
    name: android-apk
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Build dev APK
        working-directory: apps/mobile
        run: flutter build apk --debug --flavor dev --dart-define-from-file=config/dev.json

      # Reviewers install this to try the PR on a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: nalum-dev-pr-${{ github.event.pull_request.number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7

  ios-build:
    name: ios-build
    needs: check
    # macOS minutes are expensive: main pushes, or PRs labelled `ios`.
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Build iOS (unsigned)
        working-directory: apps/mobile
        # No iOS flavors yet (docs/RELEASING.md §2).
        run: flutter build ios --debug --no-codesign --dart-define-from-file=config/dev.json
